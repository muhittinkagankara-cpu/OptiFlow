# OptiFlow arayuzu icin nginx yapilandirmasi.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tek sayfalik uygulama: bilinmeyen her yol index.html'e duser.
    # Dusmeseydi, tarayicida /reports adresini yenilemek 404 verirdi.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Icerigi hash'li dosyalar uzun sureli onbelleklenir; index.html
    # onbelleklenmez ki yeni dagitim hemen gorunsun.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Guvenlik basliklari: API tarafiyla ayni politika.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
