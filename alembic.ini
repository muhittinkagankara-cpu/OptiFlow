# Alembic yapılandırması.
#
# Bağlantı adresi burada tutulmaz: `sqlalchemy.url` bilinçli olarak boştur ve
# `migrations/env.py` onu `DATABASE_URL` ortam değişkeninden okur. Adresi bu
# dosyaya yazmak, veritabanı parolasının depoya (repository) girmesi demek
# olurdu.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Göç dosyaları tarih önekiyle adlandırılır; böylece dizin listesi kronolojik
# okunur ve iki göçün hangisinin önce geldiği dosya adından anlaşılır.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
