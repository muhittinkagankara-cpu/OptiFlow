# OptiFlow uretim profili.
#
# Uc servis: veritabani, backend ve arayuz. Her biri kendi saglik denetimine
# sahiptir ve backend, veritabani hazir olana kadar baslatilmaz.
#
# Calistirma:
#   cp .env.example .env    # degerleri doldurun
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Gizli bilgiler dosyaya **yazilmaz**: hepsi `.env` uzerinden gelir ve `.env`
# surum kontrolune girmez. Compose dosyasina gomulseydi, parolalar depo
# gecmisinde kalici olarak dururdu.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER tanimlanmali}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanimlanmali}
      POSTGRES_DB: ${POSTGRES_DB:-optiflow}
    volumes:
      - optiflow-db:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` gercek bir baglanti dener; kapsayicinin ayakta olmasi
      # veritabaninin hazir oldugu anlamina gelmez.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-optiflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Veritabani disari acilmaz: yalnizca ic ag uzerinden erisilir.
    expose:
      - "5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      OPTIFLOW_ENV: production
      PORT: 8000
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-optiflow}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:?SUPABASE_JWKS_URL tanimlanmali}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?FRONTEND_ORIGINS tanimlanmali}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Zarif kapanis icin sure taninir: acik SSE baglantilari ve cihaz
    # akislari kapatilir. Varsayilan 10 saniye, uzun suren bir yoklama
    # dongusunu yarida kesebilir.
    stop_grace_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL tanimlanmali}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  optiflow-db:
